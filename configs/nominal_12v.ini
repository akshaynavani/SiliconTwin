# 48 V -> 12 V / 5 A buck converter, nominal calibration.
[sim]
name = nominal_12v
duration_ms = 200
seed = 1

[plant]
vin = 48
inductance_uh = 47
capacitance_uf = 220
r_inductor = 0.05
r_load = 2.4

[bench]
enable = true
adc_noise_lsb = 1.0

[firmware]
vref = 12.0
kp_v = 0.5
ki_v = 250
kp_i = 0.3
current_limit = 8
soft_start_ms = 20
ocp_trip = 12
ovp_trip = 14.5
max_retries = 3
retry_delay_ms = 100
wdt_timeout_ms = 50
